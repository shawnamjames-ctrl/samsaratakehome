name: Validate public project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical-appendix
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python tools/test_workflow_contracts.py
      - run: python tools/validate_json_contracts.py
      - run: python tools/validate_public_outputs.py
      - run: python tools/check_export_privacy.py
      - run: python tools/check_public_boundary.py
      - run: python tools/build_site.py
      - run: python tools/test_site_slice.py
