name: Deploy approved site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site-src/**"
      - "public-data/releases/**"
      - "deliverables/**"
      - "tools/build_site.py"
      - "tools/test_site_slice.py"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/validate_public_outputs.py
      - run: python tools/check_export_privacy.py
      - run: python tools/check_public_boundary.py
      - run: python tools/build_site.py
      - run: python tools/test_site_slice.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
