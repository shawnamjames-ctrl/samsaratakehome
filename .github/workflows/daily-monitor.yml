name: Daily private review monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-review-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ vars.MONITORING_ENABLED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      STATE_BACKEND: s3
      PRIVATE_STATE_BUCKET: ${{ secrets.PRIVATE_STATE_BUCKET }}
      PRIVATE_STATE_PREFIX: ${{ secrets.PRIVATE_STATE_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore private operational database
        run: python pipeline/state_store.py pull-db
      - name: Restore the last publicly reported comparison state
        run: python pipeline/state_store.py pull-published-db --database data/processed/prior_monitoring_reviews.sqlite3
      - name: Collect recent reviews
        run: python review_monitor.py --config config/monitoring_sources.json daily
      - name: Retain raw snapshots for audit and diagnosis
        if: ${{ always() && hashFiles('data/monitoring/raw/**/*.json') != '' }}
        run: python pipeline/state_store.py push-raw
      - name: Validate private source state
        run: python review_monitor.py --config config/monitoring_sources.json validate
      - name: Analyze existing themes and route emerging signals
        run: python pipeline/analyze_monitoring.py
      - name: Update privacy-safe dashboard files
        run: python pipeline/update_dashboard.py --baseline data/processed/prior_monitoring_reviews.sqlite3
      - run: python tools/validate_public_outputs.py
      - run: python tools/check_export_privacy.py
      - run: python tools/check_public_boundary.py
      - run: python tools/build_site.py
      - run: python tools/test_site_slice.py
      - run: python tools/mark_publishable.py
      - run: python tools/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy daily dashboard
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Commit the successfully deployed privacy-safe dashboard
        run: |
          git config user.name "review-monitor-bot"
          git config user.email "review-monitor-bot@users.noreply.github.com"
          git add public-data/dashboard docs/data/dashboard
          git diff --cached --quiet || git commit -m "chore: refresh daily review monitor"
          git push
      - name: Advance private state only after successful deployment and commit
        run: |
          python pipeline/state_store.py push-db
          python pipeline/state_store.py push-published-db
